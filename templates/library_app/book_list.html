{% extends 'base.html' %}


{% block title %}
Book List page
{% endblock %}


{% block content %}
 <h2>This is the book list page</h2>
 <ul>
     {% for book in books %}
     <li>
         <b>{{book.title}}</b>
         <p>By: <b>{{book.author}}</b></p>
         <a href="{% url 'book_detail' book.id %}">Details</a>
         <a href="{% url 'book_update' book.id %}">Edit</a>
        <hr>
    </li>
    {% endfor %}
 </ul>
{% endblock %}
