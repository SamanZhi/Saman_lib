{% extends 'base.html' %}


{% block title %}
Book List page
{% endblock %}


{% block content %}
 <h2>This is the book list page</h2>
 <ul>
     {% for book in books %}
     <li>
        <a href="{% url 'book_detail' book.id %}">
            <b>{{book.title}}</b>
        </a>
        <p>By: <b>{{book.author}}</b></p>
        <hr>
    </li>
    {% endfor %}
 </ul>
{% endblock %}
