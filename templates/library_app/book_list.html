{% extends 'base.html' %}


{% block title %}
Book List page
{% endblock %}


{% block content %}
 <h2>This is the book list page</h2>
 <ul>
    <li>
    {% for book in books %}
        <a href="{% url 'book_detail' book.id %}">
            <p><b>{{book.title}}</b></p>
        </a>
        <p>By: <b>{{book.author}}</b></p>
        <hr>
    </li>
    {% endfor %}
 </ul>
{% endblock %}
